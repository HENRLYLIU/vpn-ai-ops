name: Check public project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q vpnctl.py vpnops scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python vpnctl.py --config config.example.json plan
      - run: python scripts/check_public_files.py
